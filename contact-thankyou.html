<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Victorious Visuals</title>

    <meta name="description"
          content="Thank you for contacting Victorious Visuals. We have received your message and will get back to you soon.">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/favicon.png">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        /* =====================================================
           VICTORIOUS VISUALS
           CONTACT THANK YOU PAGE
           ===================================================== */

        :root {
            --vv-teal: #009eaa;
            --vv-teal-dark: #008691;
            --vv-light: #e9f8f9;
            --vv-text: #111111;
            --vv-muted: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #ffffff;
            color: var(--vv-text);
            overflow-x: hidden;
        }


        /* =====================================================
           PAGE
           ===================================================== */

        .thankyou-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            padding: 40px 20px;

            overflow: hidden;
        }


        /* =====================================================
           BACKGROUND DECORATION
           ===================================================== */

        .thankyou-page::before {
            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: rgba(0, 158, 170, 0.06);

            top: -250px;
            right: -180px;

            animation: floatCircle 7s ease-in-out infinite;
        }

        .thankyou-page::after {
            content: "";

            position: absolute;

            width: 400px;
            height: 400px;

            border-radius: 50%;

            background: rgba(0, 158, 170, 0.05);

            bottom: -220px;
            left: -180px;

            animation: floatCircle 9s ease-in-out infinite reverse;
        }


        @keyframes floatCircle {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(25px);
            }
        }


        /* =====================================================
           FLOATING PARTICLES
           ===================================================== */

        .particle {
            position: absolute;

            width: 7px;
            height: 7px;

            background: var(--vv-teal);

            border-radius: 50%;

            opacity: 0.25;

            animation: particleFloat 5s ease-in-out infinite;
        }

        .particle:nth-child(1) {
            top: 18%;
            left: 15%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            top: 30%;
            right: 18%;
            animation-delay: 1s;
        }

        .particle:nth-child(3) {
            bottom: 22%;
            left: 25%;
            animation-delay: 2s;
        }

        .particle:nth-child(4) {
            bottom: 30%;
            right: 13%;
            animation-delay: 3s;
        }

        .particle:nth-child(5) {
            top: 15%;
            left: 50%;
            animation-delay: 1.5s;
        }

        @keyframes particleFloat {

            0%,
            100% {
                transform: translateY(0) scale(1);
                opacity: 0.2;
            }

            50% {
                transform: translateY(-20px) scale(1.4);
                opacity: 0.5;
            }
        }


        /* =====================================================
           THANK YOU CARD
           ===================================================== */

        .thankyou-card {

            position: relative;
            z-index: 5;

            width: 100%;
            max-width: 650px;

            padding: 55px 45px;

            text-align: center;

            background: rgba(255, 255, 255, 0.96);

            border: 1px solid rgba(0, 158, 170, 0.12);

            border-radius: 28px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.08);

            animation: cardEntrance 0.8s ease forwards;
        }


        @keyframes cardEntrance {

            from {
                opacity: 0;
                transform: translateY(35px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =====================================================
           SUCCESS ICON
           ===================================================== */

        .success-icon {

            width: 100px;
            height: 100px;

            margin: 0 auto 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            background: var(--vv-light);

            border-radius: 50%;

            color: var(--vv-teal);

            font-size: 50px;

            animation: iconPop 0.7s ease 0.35s both;
        }


        .success-icon::before {

            content: "";

            position: absolute;

            inset: -8px;

            border-radius: 50%;

            border: 2px solid rgba(0, 158, 170, 0.15);

            animation: iconRing 2s ease-out infinite;
        }


        @keyframes iconPop {

            0% {
                opacity: 0;
                transform: scale(0.4);
            }

            70% {
                transform: scale(1.08);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }


        @keyframes iconRing {

            0% {
                transform: scale(0.9);
                opacity: 0.7;
            }

            100% {
                transform: scale(1.35);
                opacity: 0;
            }
        }


        /* =====================================================
           HEADING
           ===================================================== */

        .thankyou-card h1 {

            font-size: clamp(34px, 6vw, 48px);

            line-height: 1.1;

            font-weight: 800;

            letter-spacing: -1.5px;

            margin-bottom: 16px;

            animation: fadeUp 0.7s ease 0.45s both;
        }

        .thankyou-card h1 span {
            color: var(--vv-teal);
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        .thankyou-message {

            max-width: 500px;

            margin: 0 auto 25px;

            color: var(--vv-muted);

            font-size: 17px;

            line-height: 1.7;

            animation: fadeUp 0.7s ease 0.55s both;
        }


        /* =====================================================
           SMALL NOTICE
           ===================================================== */

        .thankyou-notice {

            display: inline-flex;

            align-items: center;

            gap: 9px;

            padding: 11px 18px;

            margin-bottom: 30px;

            background: #f5fbfc;

            border-radius: 50px;

            color: #555;

            font-size: 14px;

            animation: fadeUp 0.7s ease 0.65s both;
        }

        .thankyou-notice i {
            color: var(--vv-teal);
        }


        /* =====================================================
           BUTTONS
           ===================================================== */

        .thankyou-actions {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;

            animation: fadeUp 0.7s ease 0.75s both;
        }


        .thankyou-home-btn {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 9px;

            padding: 14px 28px;

            min-width: 180px;

            border-radius: 50px;

            background: var(--vv-teal);

            color: #ffffff !important;

            text-decoration: none;

            font-size: 16px;

            font-weight: 700;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }


        .thankyou-home-btn:hover {

            background: var(--vv-teal-dark);

            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(0, 158, 170, 0.25);
        }


        /* =====================================================
           FOOTER NOTE
           ===================================================== */

        .thankyou-footer {

            margin-top: 38px;

            padding-top: 22px;

            border-top: 1px solid rgba(0, 158, 170, 0.12);

            color: #888;

            font-size: 13px;

            animation: fadeUp 0.7s ease 0.85s both;
        }

        .thankyou-footer strong {
            color: var(--vv-teal);
        }


        /* =====================================================
           GENERAL ANIMATION
           ===================================================== */

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .thankyou-page {
                padding: 25px 15px;
            }

            .thankyou-card {

                padding: 42px 24px;

                border-radius: 23px;
            }

            .success-icon {

                width: 85px;
                height: 85px;

                font-size: 42px;

                margin-bottom: 24px;
            }

            .thankyou-card h1 {

                font-size: 35px;

                letter-spacing: -1px;
            }

            .thankyou-message {

                font-size: 16px;

                line-height: 1.6;
            }

            .thankyou-notice {

                font-size: 13px;
            }

            .thankyou-home-btn {

                width: 100%;
            }

            .thankyou-footer {

                margin-top: 30px;
            }
        }

    </style>
</head>


<body>

    <main class="thankyou-page">

        <!-- Decorative particles -->
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>


        <!-- Thank You Card -->
        <div class="thankyou-card">

            <!-- Animated Success Icon -->
            <div class="success-icon">
                <i class="bi bi-check-lg"></i>
            </div>


            <!-- Heading -->
            <h1>
                Thank <span>You!</span>
            </h1>


            <!-- Message -->
            <p class="thankyou-message">
                Your message has been successfully received.
                Thank you for reaching out to Victorious Visuals.
                We appreciate your interest and will get back to you
                as soon as possible.
            </p>


            <!-- Notice -->
            <div class="thankyou-notice">
                <i class="bi bi-envelope-check-fill"></i>
                <span>We have received your message</span>
            </div>


            <!-- Action -->
            <div class="thankyou-actions">

                <a href="index.html" class="thankyou-home-btn">
                    <i class="bi bi-house-door-fill"></i>
                    Back to Home
                </a>

            </div>


            <!-- Footer -->
            <div class="thankyou-footer">

                <strong>Victorious Visuals</strong>
                <span> • Professional Graphic Design Services</span>

            </div>

        </div>

    </main>

</body>
</html>
